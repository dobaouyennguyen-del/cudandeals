<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P-04 Quên mật khẩu – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-role="public" data-active="">
<div id="cdd-header"></div>

<!-- ============ P-04 · Quên mật khẩu ============
  FR-1.3 Lấy lại mật khẩu qua email (dùng sendPasswordResetEmail của Firebase)
  Xem trạng thái đã gửi: forgot-password.html?sent=1
============================================== -->
<main class="auth-wrap">
  <div class="auth-card" style="max-width:460px">
    <div id="formView">
      <div class="auth-icon"><i class="bi bi-key"></i></div>
      <h1 class="h3 fw-bold text-center mb-1">Quên mật khẩu?</h1>
      <p class="text-center text-muted-2 small-2 mb-4">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
      <form id="fpForm" novalidate>
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control mb-1" placeholder="example@email.com" required>
        <div class="invalid-feedback mb-2">Vui lòng nhập email hợp lệ.</div>
        <button type="submit" class="btn btn-accent w-100 mt-3" style="min-height:52px">Gửi link đặt lại<i class="bi bi-send"></i></button>
      </form>
    </div>
    <div id="sentView" class="text-center d-none">
      <div class="auth-icon" style="background:var(--success-soft);color:var(--success)"><i class="bi bi-envelope-check"></i></div>
      <h1 class="h3 fw-bold mb-2">Kiểm tra email của bạn</h1>
      <p class="text-muted-2 small-2">Đã gửi link đặt lại mật khẩu đến <b id="sentTo">hoanggiang@gmail.com</b>. Link có hiệu lực trong 1 giờ.</p>
      <p class="small-2 text-muted-2">Không thấy email? Kiểm tra mục Spam hoặc <a href="#" id="resend">gửi lại</a>.</p>
    </div>
    <p class="text-center mt-4 mb-0"><a href="login.html" class="small-2 fw-semibold"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a></p>
  </div>
</main>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  function sent(mail) { $('formView').classList.add('d-none'); $('sentView').classList.remove('d-none'); if (mail) $('sentTo').textContent = mail; }
  $('fpForm').addEventListener('submit', (e) => { e.preventDefault(); const ok = /\S+@\S+\.\S+/.test($('email').value); $('email').classList.toggle('is-invalid', !ok); if (ok) sent($('email').value); });
  $('resend').onclick = (e) => { e.preventDefault(); CDD.toast('Đã gửi lại email'); };
  if (new URLSearchParams(location.search).get('sent')) sent();
</script>
</body>
</html>
