<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-06 Thống kê hiệu quả – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body data-role="partner" data-active="stats">
<div id="cdd-header"></div>

<!-- ============ B-06 · Thống kê hiệu quả voucher ============
  FR-2.7 Đối tác xem số lượt cư dân nhận mã (FR-3.4) và đã dùng (Redemption – FR-2.5) cho từng voucher
========================================================== -->
<main class="container container-cdd">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div><h1>Thống kê hiệu quả</h1><p>Lượt nhận mã và lượt dùng tại cửa hàng của các voucher.</p></div>
    <div class="d-flex gap-2">
      <select class="form-select w-auto" id="vSel" style="min-height:44px" aria-label="Chọn voucher"><option value="all">Tất cả voucher</option></select>
      <select class="form-select w-auto" style="min-height:44px" aria-label="Khoảng thời gian"><option>30 ngày qua</option><option>7 ngày qua</option><option>90 ngày qua</option></select>
    </div>
  </div>
  <div class="row g-3 mb-4" id="kpis"></div>
  <div class="cdd-card mb-4">
    <div class="chart-head"><div><h2>Lượt nhận mã và đã dùng theo ngày</h2><p id="chartSub">Tất cả voucher · 30 ngày qua</p></div><button class="link-btn" data-bs-toggle="collapse" data-bs-target="#tb">Xem dạng bảng</button></div>
    <div class="chart-box"><canvas id="c1" role="img" aria-label="Biểu đồ đường lượt nhận mã và đã dùng theo ngày"></canvas></div>
    <div class="collapse mt-3" id="tb" style="max-height:260px;overflow:auto"></div>
  </div>
  <div class="cdd-card">
    <div class="chart-head"><div><h2>Hiệu quả từng voucher</h2><p>Tỷ lệ sử dụng = đã dùng / đã nhận</p></div></div>
    <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr class="small-2 text-muted-2"><th>Voucher</th><th>Trạng thái</th><th class="text-end">Đã nhận</th><th class="text-end">Đã dùng</th><th style="min-width:180px">Tỷ lệ sử dụng</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../../js/charts.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  const VS = D.partnerVouchers.filter(v => v.received > 0);
  VS.forEach(v => $('vSel').insertAdjacentHTML('beforeend', `<option value="${v.id}">${v.title}</option>`));
  const days = Array.from({ length: 30 }, (_, i) => `${String(i + 1).padStart(2, '0')}/10`);
  // Dữ liệu mẫu theo ngày (Phase 3: tổng hợp từ codes & redemptions trên Firestore)
  const base = days.map((_, i) => Math.round(6 + 4 * Math.sin(i / 3) + i / 4));
  let chart;
  function draw(id) {
    const v = VS.find(x => x.id === id), k = v ? v.received / 246 : 1;
    const recv = base.map(n => Math.round(n * k * 1.2)), used = recv.map((n, i) => Math.round(n * (0.5 + 0.1 * Math.sin(i))));
    const R = v ? v.received : 246, U = v ? v.used : 150;
    $('kpis').innerHTML = [['Lượt nhận mã', R, 'ic-orange', 'bi-download'], ['Lượt đã dùng', U, 'ic-green', 'bi-check2-circle'], ['Tỷ lệ sử dụng', Math.round(U / R * 100) + '%', 'ic-blue', 'bi-percent'], ['Đánh giá TB', '4.8', 'ic-amber', 'bi-star']]
      .map(([l, n, c, i]) => `<div class="col-6 col-lg-3"><div class="cdd-card kpi"><div class="top">${l}<span class="ic ${c}"><i class="bi ${i}"></i></span></div><div class="num">${n}</div></div></div>`).join('');
    $('chartSub').textContent = (v ? v.title : 'Tất cả voucher') + ' · 30 ngày qua';
    if (chart) chart.destroy();
    chart = CDDChart.line($('c1'), days, [{ label: 'Nhận mã', data: recv }, { label: 'Đã dùng', data: used }]);
    CDDChart.table($('tb'), ['Ngày', 'Nhận mã', 'Đã dùng'], days.map((d, i) => [d, recv[i], used[i]]));
  }
  const ST = { active: ['Đang chạy', 'tag-success'], paused: ['Tạm tắt', 'tag-muted'], soldout: ['Hết lượt', 'tag-muted'], expired: ['Hết hạn', 'tag-muted'], removed: ['Bị gỡ', 'tag-danger'], pending: ['Chờ duyệt', 'tag-warning'] };
  $('rows').innerHTML = VS.map(v => { const p = Math.round(v.used / v.received * 100); return `<tr>
    <td><div class="d-flex align-items-center gap-3"><img class="thumb" src="${CDD.IMG}${v.img}" alt=""><span class="fw-semibold">${v.title}</span></div></td>
    <td><span class="tag ${ST[v.status][1]}">${ST[v.status][0]}</span></td>
    <td class="text-end">${v.received}</td><td class="text-end fw-semibold">${v.used}</td>
    <td><div class="d-flex align-items-center gap-2"><div class="progress flex-fill" style="height:8px;background:#F1F5F9"><div class="progress-bar" style="width:${p}%;background:var(--primary)"></div></div><span class="small-2 fw-semibold" style="width:38px">${p}%</span></div></td></tr>`; }).join('');
  $('vSel').addEventListener('change', (e) => draw(e.target.value));
  draw('all');
</script>
</body>
</html>
