<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-05 Xác nhận mã – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .wrap { max-width: 640px; margin: 0 auto; }
    .scan { aspect-ratio: 1; max-width: 240px; margin: 0 auto; border-radius: 16px; background: var(--primary-soft); position: relative; display: grid; place-items: center; color: var(--primary); }
    .scan::before, .scan::after { content: ""; position: absolute; inset: 14px; border: 3px solid var(--primary); border-radius: 12px;
      clip-path: polygon(0 0, 22% 0, 22% 3px, 3px 3px, 3px 22%, 0 22%, 0 78%, 3px 78%, 3px calc(100% - 3px), 22% calc(100% - 3px), 22% 100%, 78% 100%, 78% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 78%, 100% 78%, 100% 22%, calc(100% - 3px) 22%, calc(100% - 3px) 3px, 78% 3px, 78% 0); }
    .scan .line { position: absolute; left: 24px; right: 24px; top: 50%; height: 2px; background: var(--primary); box-shadow: 0 0 12px var(--primary); }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--hint); font-size: 12px; font-weight: 700; letter-spacing: .08em; margin: 24px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .code-input { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 700; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    .result-icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; margin: 0 auto 12px; }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px; }
    .kv span { display: block; color: var(--muted); font-size: 12px; }
    .mono { font-family: 'Courier New', monospace; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body data-role="partner" data-active="redeem">
<div id="cdd-header"></div>

<!-- ============ B-05 · Xác nhận mã (Redeem) ============
  FR-2.5 Xác nhận sử dụng voucher – mã dùng rồi KHÔNG dùng được lần 2
  FR-2.8 Quét QR (mở rộng) – chỉ là cách nhập mã khác, logic giữ nguyên
  Mã demo: CDD-HG2026-001 (hợp lệ) · CDD-MT2026-002 (đã dùng) · CDD-HG2026-009 (hết hạn)
  Mở sẵn popup: confirm-redeem.html?result=ok | ?result=fail
===================================================== -->
<main class="container container-cdd">
  <div class="wrap">
    <div class="page-head text-center">
      <span class="tag tag-primary mb-2"><i class="bi bi-shop"></i>Tại quầy · Sunrise Coffee & Tea</span>
      <h1>Xác nhận mã ưu đãi</h1>
      <p>Quét mã QR hoặc nhập mã cư dân đưa để xác nhận sử dụng.</p>
    </div>

    <section class="cdd-card">
      <div class="scan"><span class="line"></span><i class="bi bi-qr-code-scan" style="font-size:56px"></i></div>
      <p class="text-center small-2 text-muted-2 mt-3 mb-2">Hướng camera vào mã QR trên điện thoại cư dân</p>
      <div class="text-center"><button class="btn btn-light-primary btn-sm px-3" id="camBtn"><i class="bi bi-camera-video"></i>Bật camera</button></div>

      <div class="divider">HOẶC NHẬP MÃ THỦ CÔNG</div>

      <form id="redeemForm" novalidate>
        <label for="code" class="form-label">Mã ưu đãi</label>
        <input id="code" class="form-control code-input mb-3" placeholder="CDD-XXXX-XXX" value="CDD-HG2026-001" autocomplete="off">
        <button type="submit" class="btn btn-accent w-100" style="min-height:52px"><i class="bi bi-check2-circle"></i>Xác nhận sử dụng mã</button>
      </form>
    </section>

    <section class="cdd-card">
      <div class="d-flex justify-content-between align-items-start"><div class="section-title">Xác nhận gần đây</div><span class="tag tag-primary">Hôm nay: <span id="todayCount">18</span> lượt</span></div>
      <div id="recent"></div>
    </section>
  </div>
</main>

<!-- Popup kết quả -->
<div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content code-modal text-center">
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Đóng"></button>
      <div class="result-icon" id="resIcon"></div>
      <h2 class="h4 fw-bold mb-1" id="resTitle"></h2>
      <p class="text-muted-2 small-2 mb-3" id="resMsg"></p>
      <div class="code-box text-start" id="resBox"></div>
      <button class="btn btn-primary w-100 mt-3" data-bs-dismiss="modal" id="resBtn">Tiếp tục xác nhận</button>
    </div>
  </div>
</div>

<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  // Dữ liệu mã demo (Phase 3: tra collection "codes" trên Firestore, ghi bản ghi Redemption)
  const CODES = {
    'CDD-HG2026-001': { name: 'Hoàng Giang', area: 'Khu dân cư Sunrise', voucher: 'Giảm 30% toàn menu đồ uống', status: 'valid' },
    'CDD-MT2026-002': { name: 'Minh Tú', area: 'Khu dân cư Sunrise', voucher: 'Mua 1 tặng 1 Latte size M', status: 'used', usedAt: '10:42 hôm nay' },
    'CDD-HG2026-009': { name: 'Hoàng Giang', area: 'Khu dân cư Sunrise', voucher: 'Giảm 15% cho hóa đơn từ 200K', status: 'expired', end: '30/09/2026' },
  };
  const recent = D.redemptions.slice();

  function renderRecent() {
    $('recent').innerHTML = recent.map(r => `
      <div class="activity"><span class="cdd-avatar" style="background:#E0E7FF;color:var(--primary)">${r.initials}</span>
        <div class="flex-fill"><b>${r.name}</b><div class="small-2 text-muted-2">${r.voucher}</div></div>
        <div class="text-end"><div class="small-2 mono">${r.code}</div><span class="tag tag-success mt-1"><i class="bi bi-check2"></i>${r.time}</span></div></div>`).join('');
  }

  function showResult(ok, code, info, reason) {
    $('resIcon').className = 'result-icon ' + (ok ? 'ic-green' : '');
    $('resIcon').style.cssText = ok ? '' : 'background:var(--danger-soft);color:var(--danger)';
    $('resIcon').innerHTML = `<i class="bi ${ok ? 'bi-check-lg' : 'bi-x-lg'}"></i>`;
    $('resTitle').textContent = ok ? 'Xác nhận thành công!' : 'Không thể xác nhận';
    $('resTitle').style.color = ok ? 'var(--success)' : 'var(--danger)';
    $('resMsg').textContent = ok ? 'Mã hợp lệ. Hãy áp dụng ưu đãi vào hóa đơn cho cư dân.' : reason;
    $('resBox').innerHTML = info ? `
      <div class="vcard-shop">Sunrise Coffee & Tea</div><div class="fw-bold mb-3">${info.voucher}</div>
      <div class="kv"><div><span>Cư dân</span>${info.name}</div><div><span>Khu dân cư</span>${info.area}</div>
      <div><span>Mã ưu đãi</span><b class="mono">${code}</b></div><div><span>${ok ? 'Thời gian xác nhận' : 'Trạng thái mã'}</span>${ok ? 'Vừa xong' : (info.status === 'used' ? 'Đã dùng lúc ' + info.usedAt : 'Hết hạn ' + info.end)}</div></div>`
      : `<div class="kv"><div><span>Mã đã nhập</span><b class="mono">${code || '(trống)'}</b></div><div><span>Kết quả</span>Không tìm thấy</div></div>`;
    $('resBtn').textContent = ok ? 'Hoàn tất & xác nhận mã khác' : 'Đóng & nhập lại';
    bootstrap.Modal.getOrCreateInstance($('resultModal')).show();
  }

  function redeem(code) {
    code = code.trim().toUpperCase();
    const info = CODES[code];
    if (!info) return showResult(false, code, null, 'Mã không tồn tại hoặc không thuộc cửa hàng của bạn. Vui lòng kiểm tra lại.');
    if (info.status === 'used') return showResult(false, code, info, 'Mã này đã được sử dụng trước đó, không thể dùng lần 2.');
    if (info.status === 'expired') return showResult(false, code, info, 'Voucher đã hết hạn, không thể áp dụng.');
    info.status = 'used'; info.usedAt = 'vừa xong';                       // mã chuyển "đã dùng"
    recent.unshift({ name: info.name, initials: 'HG', voucher: info.voucher, code, time: 'Vừa xong' });
    $('todayCount').textContent = +$('todayCount').textContent + 1;
    renderRecent(); showResult(true, code, info);
  }

  $('redeemForm').addEventListener('submit', (e) => { e.preventDefault(); redeem($('code').value); });
  $('camBtn').addEventListener('click', () => CDD.toast('Demo: bản thật dùng thư viện quét QR, mã quét được sẽ tự điền vào ô bên dưới.'));
  renderRecent();

  const r = new URLSearchParams(location.search).get('result');
  if (r === 'ok') redeem('CDD-HG2026-001');
  if (r === 'fail') { $('code').value = 'CDD-HG2026-009'; redeem('CDD-HG2026-009'); }
</script>
</body>
</html>
