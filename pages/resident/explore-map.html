<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-01b Khám phá – Bản đồ – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .qchip { white-space: nowrap; border: 1px dashed #CBD5E1; background: #fff; color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
    .qchip.on { background: #FFF1E7; border: 1px solid var(--accent); color: var(--accent); }
    .quick { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }

    /* ---------- Bản đồ ---------- */
    .map-card { padding: 0; overflow: hidden; }
    .map-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; }
    .legend button { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--text); transition: background-color .15s, border-color .15s, opacity .15s; }
    .legend button .sw { width: 10px; height: 10px; border-radius: 50%; }
    .legend button.off { opacity: .4; }

    /* ---------- Bảng bên phải ---------- */
    .shop-panel { position: sticky; top: 88px; }
    .shop-hero { position: relative; height: 150px; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
    .shop-hero img { width: 100%; height: 100%; object-fit: cover; animation: fadeImg .5s ease both; }
    .shop-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(15,23,42,.8)); }
    .shop-hero .cap { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; color: #fff; }
    .shop-hero .cap b { font-size: 18px; display: block; }
    @keyframes fadeImg { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
    .walk-box { display: flex; gap: 12px; align-items: center; background: #FFF7ED; border-radius: 10px; padding: 10px 12px; }
    .walk-box .big { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
    .mini-v { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
    .mini-v .b { flex: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 11px; padding: 4px 7px; border-radius: 6px; max-width: 92px; text-align: center; line-height: 1.2; }
    .mini-v .t { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .mini-v:hover .t { color: var(--primary); }
    .near { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px; border-radius: 10px; text-align: left; transition: background-color .15s; }
    .near:hover { background: var(--bg); }
    .near .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-size: 14px; }
    .panel-anim { animation: panelIn .35s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (max-width: 767.98px) { .pin .bub span.pct { display: none; } .pin .bub { padding: 4px; } .map .lbl { font-size: 18px; } .walk-tag { font-size: 10px; } }
  </style>
</head>
<body data-role="resident" data-active="explore">
<div id="cdd-header"></div>

<!-- ============ R-01b · Khám phá – chế độ Bản đồ ============
  FR-3.6 Bản đồ cửa hàng & chỉ đường: vị trí cửa hàng có ưu đãi, chọn 1 cửa hàng để xem khoảng cách,
  thời gian đi bộ ước tính và mở chỉ đường (Google Maps theo địa chỉ).
  Chuyển chế độ: Danh sách (explore.html) | Bản đồ (trang này) – mang theo từ khóa & phạm vi đang chọn.
  Vị trí quán, tòa của cư dân và phút đi bộ là dữ liệu mẫu (Phase 3: đối tác chọn vị trí ở B-02, cư dân khai báo tòa).
======================================================================== -->
<main class="container container-cdd">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <h1>Ưu đãi dành cho bạn</h1>
      <p>Voucher công khai và voucher riêng của <b>Khu dân cư Sunrise</b>.</p>
    </div>
    <div class="view-toggle" role="tablist" aria-label="Chế độ xem">
      <a href="explore.html" id="toList" role="tab" aria-selected="false"><i class="bi bi-grid-3x3-gap"></i>Danh sách</a>
      <a href="explore-map.html" id="toMap" role="tab" aria-selected="true" class="on"><i class="bi bi-map"></i>Bản đồ</a>
    </div>
  </div>

  <div class="position-relative search-lg mb-3">
    <i class="bi bi-search"></i>
    <input id="search" class="form-control" placeholder="Tìm theo tên quán, món ăn hoặc dịch vụ..." aria-label="Tìm kiếm ưu đãi">
  </div>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <div class="pill-tabs" id="scopeTabs">
      <button class="pill active" data-scope="all">Tất cả</button>
      <button class="pill" data-scope="area"><i class="bi bi-buildings"></i>Riêng khu Sunrise</button>
      <button class="pill" data-scope="public"><i class="bi bi-globe2"></i>Công khai</button>
    </div>
  </div>
  <div class="quick mb-3" id="quick">
    <span class="small-2 fw-semibold text-muted-2 text-nowrap"><i class="bi bi-lightning-charge-fill text-accent"></i> Lọc nhanh:</span>
    <button class="qchip" data-q="exp3"><i class="bi bi-hourglass-split"></i>Sắp hết hạn</button>
    <button class="qchip" data-q="pct30"><i class="bi bi-percent"></i>Giảm từ 30%</button>
    <button class="qchip" data-q="gift"><i class="bi bi-gift"></i>Có quà tặng</button>
    <button class="qchip" data-q="near"><i class="bi bi-person-walking"></i>Trong 3 phút đi bộ</button>
  </div>

  <div class="row g-4">
    <!-- Bản đồ -->
    <div class="col-lg-8">
      <div class="cdd-card map-card">
        <div class="map-head">
          <div><b>Sơ đồ Khu dân cư Sunrise</b><div class="small-2 text-muted-2"><span id="shopCount"></span> cửa hàng đang có ưu đãi · bấm vào ghim để xem</div></div>
          <div class="legend" id="legend"></div>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- Cửa hàng đang chọn -->
    <div class="col-lg-4">
      <div class="cdd-card shop-panel" id="panel"></div>
    </div>
  </div>
</main>

<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/map.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  // Sơ đồ khu, vị trí cửa hàng, đường đi bộ: dùng chung js/map.js
  const { COLORS, POS, HOME, route, meters, minutes } = CDDMap;
  CDDMap.mount($('map'));

  // ---- Gom voucher theo cửa hàng ----
  const shops = [...new Set(D.vouchers.map(v => v.shop))].filter(s => POS[s]).map(name => {
    const list = D.vouchers.filter(v => v.shop === name);
    return { name, list, cat: list[0].cat, img: list[0].img, address: list[0].address };
  });
  const state = { scope: 'all', q: '', quick: new Set(), cats: new Set(D.categories.map(c => c.id)), sel: 'Sunrise Coffee & Tea' };
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').toLowerCase();
  const vOk = (v) => !CDD.isOut(v) && (state.scope === 'all' || v.scope === state.scope) &&
    (!state.q || norm(v.title + ' ' + v.shop).includes(norm(state.q))) &&
    (!state.quick.has('exp3') || v.daysLeft <= 3) && (!state.quick.has('pct30') || v.pct >= 30) && (!state.quick.has('gift') || v.type === 'gift');
  const shopOk = (s) => state.cats.has(s.cat) && (!state.quick.has('near') || minutes(s.name) <= 3) && s.list.some(vOk);

  // Chú thích ngành hàng = bộ lọc
  const usedCats = D.categories.filter(c => shops.some(s => s.cat === c.id));
  $('legend').innerHTML = usedCats.map(c => `<button data-cat="${c.id}"><span class="sw" style="background:${COLORS[c.id]}"></span>${c.name}</button>`).join('');

  // Nhãn ngắn trên ghim: GIẢM 30% → -30%, MUA 1 TẶNG 1 → 1+1, TẶNG … → Quà
  const short = (b) => /MUA 1 TẶNG 1/.test(b) ? '1+1' : /^TẶNG/.test(b) ? 'Quà' : b.replace('GIẢM ', '-');
  function drawPins() {
    $('pins').innerHTML = shops.map((s, i) => {
      const ok = shopOk(s), vs = s.list.filter(vOk), best = (vs.length ? vs : s.list).reduce((a, b) => (b.pct > a.pct ? b : a));
      const icon = D.categories.find(c => c.id === s.cat).icon;
      const urgent = vs.some(v => v.daysLeft <= 3);
      return `<button class="pin${ok ? '' : ' dim'}${urgent ? ' urgent' : ''}${s.name === state.sel ? ' sel' : ''}" data-shop="${s.name}"
          style="left:${POS[s.name][0] / 10}%;top:${POS[s.name][1] / 6.2}%;animation-delay:${i * 60}ms" aria-label="${s.name}">
        <span class="tip">${s.name}</span>
        <span class="bub"><span class="ic" style="background:${COLORS[s.cat]}"><i class="bi ${icon}"></i></span><span class="pct">${short(best.badge)}</span>
          ${vs.length > 1 ? `<span class="cnt">${vs.length}</span>` : ''}</span>
      </button>`;
    }).join('');
    $('shopCount').textContent = shops.filter(shopOk).length;
    document.querySelectorAll('#legend button').forEach(b => b.classList.toggle('off', !state.cats.has(b.dataset.cat)));
    document.querySelectorAll('.qchip').forEach(b => b.classList.toggle('on', state.quick.has(b.dataset.q)));
  }

  function drawRoute() {
    const s = shops.find(x => x.name === state.sel);
    CDDMap.showRoute(s && shopOk(s) ? s.name : null);
  }

  function drawPanel() {
    const s = shops.find(x => x.name === state.sel);
    if (!s) { $('panel').innerHTML = '<p class="text-muted-2 mb-0">Chọn một ghim trên bản đồ để xem ưu đãi.</p>'; return; }
    const cat = D.categories.find(c => c.id === s.cat);
    const nearList = shops.filter(x => x.name !== s.name && shopOk(x)).sort((a, b) => meters(a.name) - meters(b.name)).slice(0, 4);
    const vs = s.list.filter(vOk).length ? s.list.filter(vOk) : s.list;
    $('panel').innerHTML = `<div class="panel-anim">
      <div class="shop-hero"><img src="${CDD.IMG}${s.img}" alt="${s.name}"><div class="cap"><span class="tag tag-accent mb-1">${cat.name}</span><b>${s.name}</b></div></div>
      <div class="small-2 text-muted-2 mb-2"><i class="bi bi-geo-alt me-1"></i>${s.address}</div>
      <div class="walk-box mb-3">
        <i class="bi bi-person-walking fs-3 text-accent"></i>
        <div class="flex-fill"><div class="big">${minutes(s.name)} phút</div><div class="small-2 text-muted-2">${meters(s.name)} m từ Tòa S1 (nhà bạn)</div></div>
        <a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="${CDDMap.directions(s.name, s.address)}"><i class="bi bi-sign-turn-right"></i>Chỉ đường</a>
      </div>
      <div class="fw-bold mb-1">${vs.length} ưu đãi tại quán</div>
      ${vs.map(v => `<a class="mini-v" href="voucher-detail.html?id=${v.id}">
          <span class="b">${v.badge}</span>
          <span class="flex-fill"><span class="t d-block">${v.title}</span>
            <span class="small-2 ${v.daysLeft <= 3 ? 'text-accent fw-semibold' : 'text-muted-2'}">${v.daysLeft <= 3 ? '<span class="pulse-dot d-inline-block align-middle" style="width:7px;height:7px;margin-right:4px"></span>' : ''}Còn ${v.daysLeft} ngày · còn ${v.left}/${v.total} mã</span></span>
          <i class="bi bi-chevron-right text-muted-2"></i></a>`).join('')}
      <button class="btn btn-accent w-100 mt-2" data-code="${vs[0].id}"><i class="bi bi-ticket-perforated"></i>Nhận mã ${vs.length > 1 ? 'ưu đãi tốt nhất' : ''}</button>
      ${nearList.length ? `<hr><div class="small-2 fw-bold text-muted-2 text-uppercase mb-1">Gần bạn khác</div>
        ${nearList.map(n => `<button class="near" data-shop="${n.name}"><span class="ic" style="background:${COLORS[n.cat]}"><i class="bi ${D.categories.find(c => c.id === n.cat).icon}"></i></span>
          <span class="flex-fill"><b class="d-block small">${n.name}</b><span class="small-2 text-muted-2">${minutes(n.name)} phút đi bộ · ${n.list.filter(vOk).length} ưu đãi</span></span><i class="bi bi-chevron-right text-muted-2"></i></button>`).join('')}` : ''}
    </div>`;
  }

  const redraw = () => {
    // quán đang chọn bị lọc mất → tự chọn quán gần nhất còn hiển thị
    const cur = shops.find(x => x.name === state.sel);
    if (!cur || !shopOk(cur)) { const first = shops.filter(shopOk).sort((a, b) => meters(a.name) - meters(b.name))[0]; if (first) state.sel = first.name; }
    drawPins(); drawRoute(); drawPanel();
  };
  const select = (name) => { state.sel = name; document.querySelectorAll('.pin').forEach(p => p.classList.toggle('sel', p.dataset.shop === name)); drawRoute(); drawPanel(); };

  $('pins').addEventListener('click', (e) => { const p = e.target.closest('.pin'); if (p) select(p.dataset.shop); });
  $('panel').addEventListener('click', (e) => { const n = e.target.closest('.near'); if (n) select(n.dataset.shop); });
  $('legend').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const c = b.dataset.cat; state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); redraw(); });
  $('quick').addEventListener('click', (e) => { const b = e.target.closest('.qchip'); if (!b) return; const q = b.dataset.q; state.quick.has(q) ? state.quick.delete(q) : state.quick.add(q); redraw(); });
  $('scopeTabs').addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (!b) return; document.querySelectorAll('#scopeTabs .pill').forEach(p => p.classList.toggle('active', p === b)); state.scope = b.dataset.scope; redraw(); });
  let t; $('search').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); redraw(); }, 250); });
  // ---- Chuyển sang Danh sách: mang theo từ khóa & phạm vi ----
  const qs = new URLSearchParams(location.search);
  $('toList').addEventListener('click', (e) => {
    e.preventDefault(); const p = new URLSearchParams();
    if (state.q) p.set('q', state.q); if (state.scope !== 'all') p.set('scope', state.scope);
    location.href = 'explore.html' + (p.toString() ? '?' + p : '');
  });
  if (qs.get('q')) { state.q = qs.get('q'); $('search').value = state.q; }
  if (['area', 'public'].includes(qs.get('scope'))) { state.scope = qs.get('scope'); document.querySelectorAll('#scopeTabs .pill').forEach(p => p.classList.toggle('active', p.dataset.scope === state.scope)); }
  if (qs.get('shop')) state.sel = qs.get('shop');
  redraw();
</script>
</body>
</html>
