<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-04 Đánh giá của tôi – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body data-role="resident" data-active="reviews">
<div id="cdd-header"></div>

<!-- ============ R-04 · Đánh giá của tôi ============
  FR-7.1 Cư dân xem lại / sửa / xóa đánh giá của chính mình (chỉ đánh giá voucher đã dùng)
================================================== -->
<main class="container container-cdd" style="max-width:860px">
  <div class="page-head"><h1>Đánh giá của tôi</h1><p>Các đánh giá bạn đã viết sau khi dùng voucher.</p></div>
  <div class="row g-3 mb-4">
    <div class="col-4"><div class="cdd-card kpi"><div class="top">Đã đánh giá<span class="ic ic-blue"><i class="bi bi-chat-square-text"></i></span></div><div class="num" id="nRev"></div></div></div>
    <div class="col-4"><div class="cdd-card kpi"><div class="top">Điểm TB<span class="ic ic-amber"><i class="bi bi-star"></i></span></div><div class="num" id="avg"></div></div></div>
    <div class="col-4"><div class="cdd-card kpi"><div class="top">Chờ đánh giá<span class="ic ic-orange"><i class="bi bi-pencil-square"></i></span></div><div class="num">1</div><div class="sub"><a href="wallet.html?tab=used">Viết ngay</a></div></div></div>
  </div>
  <div id="list"></div>
</main>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  const MY = [
    { v: 'v8', stars: 5, date: '12/10/2026', text: 'Trà thơm, nhân viên dễ thương. Sẽ quay lại!', reply: 'Cảm ơn bạn đã ghé quán!' },
    { v: 'v1', stars: 5, date: '08/10/2026', text: 'Cà phê ngon, mã áp dụng nhanh, không phải chờ.' },
    { v: 'v2', stars: 4, date: '02/10/2026', text: 'Bánh ngon nhưng giờ cao điểm phải chờ hơi lâu.' },
  ];
  function render() {
    $('nRev').textContent = MY.length;
    $('avg').textContent = MY.length ? (MY.reduce((s, r) => s + r.stars, 0) / MY.length).toFixed(1) : '–';
    $('list').innerHTML = MY.map((r, i) => { const v = CDD.findVoucher(r.v); return `<div class="cdd-card">
      <div class="d-flex gap-3 align-items-start"><img src="${CDD.IMG}${v.img}" class="thumb" alt="">
        <div class="flex-fill"><div class="d-flex justify-content-between flex-wrap gap-2"><b>${v.shop}</b><span class="rating">${CDD.stars(r.stars)}</span></div>
          <div class="small-2 text-muted-2">Voucher: ${v.title} · ${r.date}</div>
          <p class="mt-2 mb-0" id="t${i}">${r.text}</p>
          ${r.reply ? `<div class="reply mt-2" style="background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px"><b class="text-accent"><i class="bi bi-shop me-1"></i>Phản hồi từ cửa hàng</b><div>${r.reply}</div></div>` : ''}
          <div class="d-flex justify-content-end gap-2 mt-2"><button class="btn btn-sm btn-light-primary" data-edit="${i}"><i class="bi bi-pencil"></i>Sửa</button><button class="btn btn-sm btn-light text-danger" data-del="${i}"><i class="bi bi-trash"></i>Xóa</button></div>
        </div></div></div>`; }).join('') || '<div class="cdd-card text-center text-muted-2 py-5">Bạn chưa có đánh giá nào.</div>';
  }
  $('list').addEventListener('click', async (e) => {
    const d = e.target.closest('[data-del]'), ed = e.target.closest('[data-edit]');
    if (d) { const r = await CDD.confirm({ title: 'Xóa đánh giá này?', message: 'Đánh giá sẽ bị gỡ khỏi trang voucher.', okText: 'Xóa', okClass: 'btn-danger', icon: 'bi-trash', tone: 'danger' });
      if (r.ok) { MY.splice(d.dataset.del, 1); render(); CDD.toast('Đã xóa đánh giá'); } }
    if (ed) { const i = ed.dataset.edit, p = $('t' + i);
      p.outerHTML = `<textarea class="form-control mt-2" id="t${i}" rows="2">${MY[i].text}</textarea>`;
      ed.outerHTML = `<button class="btn btn-sm btn-primary" data-save-rev="${i}">Lưu</button>`; }
    const sv = e.target.closest('[data-save-rev]');
    if (sv) { MY[sv.dataset.saveRev].text = $('t' + sv.dataset.saveRev).value; render(); CDD.toast('Đã cập nhật đánh giá'); }
  });
  render();
</script>
</body>
</html>
