<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-04 Duyệt voucher – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .rv { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--warning); border-radius: 12px; box-shadow: var(--shadow); }
    .rv + .rv { margin-top: 12px; }
    .rv.approved { border-left-color: var(--success); } .rv.rejected, .rv.removed { border-left-color: var(--danger); }
    .rv-head { display: flex; gap: 14px; align-items: center; padding: 14px 16px; cursor: pointer; }
    .rv-head img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; }
    .rv-body { border-top: 1px solid var(--border); padding: 16px; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .facts div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
    .facts span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
    .chev { transition: transform .2s; } .rv-head[aria-expanded=true] .chev { transform: rotate(180deg); }
    .checklist { list-style: none; padding: 0; margin: 0; font-size: 14px; } .checklist li { margin-bottom: 6px; }
  </style>
</head>
<body data-role="admin" data-active="vouchers">
<div id="cdd-header"></div>

<!-- ============ A-04 · Duyệt / gỡ voucher ============
  FR-4.2 Admin duyệt voucher trước khi hiển thị, hoặc gỡ voucher vi phạm
  (voucher chưa duyệt KHÔNG hiện với cư dân)
================================================== -->
<main class="container container-cdd">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div><h1>Duyệt voucher</h1><p>Kiểm tra nội dung voucher đối tác gửi lên trước khi hiển thị cho cư dân.</p></div>
    <span class="tag tag-warning py-2 px-3" id="pendingBadge"></span>
  </div>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <div class="pill-tabs" id="tabs"></div>
    <div class="search-sm"><i class="bi bi-search"></i><input id="search" class="form-control" placeholder="Tìm theo cửa hàng, voucher..." aria-label="Tìm voucher"></div>
  </div>
  <div id="list"></div>
  <p class="small-2 text-muted-2 mt-3"><i class="bi bi-shield-lock me-1"></i>Mọi quyết định duyệt / từ chối / gỡ đều được gửi thông báo đến đối tác.</p>
</main>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  const ST = { pending: ['Chờ duyệt', 'tag-warning'], approved: ['Đang hiển thị', 'tag-success'], rejected: ['Đã từ chối', 'tag-danger'], removed: ['Đã gỡ', 'tag-danger'] };
  let tab = 'pending', q = '';
  function card(v, i) {
    const open = i === 0 && v.status === 'pending';
    let actions = '';
    if (v.status === 'pending') actions = `<button class="btn btn-light text-danger px-3" data-act="reject" data-id="${v.id}"><i class="bi bi-x-lg"></i>Từ chối</button>
      <button class="btn btn-success px-4" data-act="approve" data-id="${v.id}"><i class="bi bi-check-lg"></i>Duyệt & hiển thị</button>`;
    if (v.status === 'approved') actions = `<button class="btn btn-light text-danger px-3" data-act="remove" data-id="${v.id}"><i class="bi bi-slash-circle"></i>Gỡ voucher</button>`;
    return `<div class="rv ${v.status}">
      <div class="rv-head" data-bs-toggle="collapse" data-bs-target="#b-${v.id}" aria-expanded="${open}">
        <img src="${CDD.IMG}${v.img}" alt="">
        <div class="flex-fill"><div class="fw-bold">${v.title}</div>
          <div class="small-2 text-muted-2">${v.shop} · ${v.cat} · Gửi lúc ${v.sent}</div></div>
        <div class="d-none d-md-flex gap-2">${CDD.scopeTag(v)}<span class="tag ${ST[v.status][1]}">${ST[v.status][0]}</span></div>
        <i class="bi bi-chevron-down chev text-muted-2"></i>
      </div>
      <div class="collapse ${open ? 'show' : ''}" id="b-${v.id}"><div class="rv-body">
        <div class="facts mb-3">
          <div><span>Loại ưu đãi</span>${v.type}</div><div><span>Mức ưu đãi</span>${v.value}</div>
          <div><span>Thời gian</span>${v.start} – ${v.end}</div><div><span>Số lượt tối đa</span>${v.max}</div>
          <div><span>Phạm vi</span>${v.scope === 'area' ? 'Riêng khu Sunrise' : 'Công khai'}</div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-7"><div class="small-2 fw-bold text-muted-2 mb-1">ĐIỀU KIỆN</div><div>${v.conditions}</div>
            ${v.ai ? '<div class="small-2 text-primary mt-2"><i class="bi bi-stars me-1"></i>Đối tác tạo với AI hỗ trợ và đã tự kiểm tra lại.</div>' : ''}
            ${v.reason ? `<div class="note note-warning mt-2"><i class="bi bi-info-circle"></i><span><b>Lý do:</b> ${v.reason}</span></div>` : ''}</div>
          <div class="col-md-5"><div class="small-2 fw-bold text-muted-2 mb-1">CHECKLIST KIỂM DUYỆT</div>
            <ul class="checklist"><li><i class="bi bi-check-circle-fill text-success me-1"></i>Đối tác đã được duyệt hồ sơ</li>
            <li><i class="bi bi-check-circle-fill text-success me-1"></i>Thời gian & số lượt hợp lệ</li>
            <li><i class="bi bi-circle text-muted-2 me-1"></i>Mức ưu đãi đúng thực tế</li></ul></div>
        </div>
        <div class="d-flex flex-wrap justify-content-end gap-2">${actions}</div>
      </div></div>
    </div>`;
  }
  function render() {
    const n = (s) => D.reviewVouchers.filter(v => v.status === s).length;
    $('tabs').innerHTML = Object.keys(ST).map(s => `<button class="pill ${s === tab ? 'active' : ''}" data-tab="${s}">${ST[s][0]} <span class="n">${n(s)}</span></button>`).join('');
    $('pendingBadge').innerHTML = `<i class="bi bi-hourglass-split"></i>${n('pending')} voucher chờ duyệt`;
    const list = D.reviewVouchers.filter(v => v.status === tab && (v.title + v.shop).toLowerCase().includes(q.toLowerCase()));
    $('list').innerHTML = list.map(card).join('') || '<div class="cdd-card text-center text-muted-2 py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Không có voucher nào.</div>';
  }
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) { tab = b.dataset.tab; render(); } });
  $('search').addEventListener('input', (e) => { q = e.target.value; render(); });
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const v = D.reviewVouchers.find(x => x.id === b.dataset.id);
    const cfg = {
      approve: { title: 'Duyệt voucher này?', message: `“${v.title}” sẽ hiển thị ngay cho cư dân.`, okText: 'Duyệt & hiển thị', okClass: 'btn-success', icon: 'bi-check-lg', tone: 'success', next: 'approved', msg: 'Đã duyệt voucher' },
      reject:  { title: 'Từ chối voucher', message: `Đối tác <b>${v.shop}</b> sẽ nhận thông báo kèm lý do.`, okText: 'Từ chối', okClass: 'btn-danger', reasonLabel: 'Lý do từ chối', requireReason: true, icon: 'bi-x-lg', tone: 'danger', next: 'rejected', msg: 'Đã từ chối voucher' },
      remove:  { title: 'Gỡ voucher đang hiển thị', message: 'Voucher sẽ bị ẩn ngay với cư dân. Mã đã nhận không dùng được nữa.', okText: 'Gỡ voucher', okClass: 'btn-danger', reasonLabel: 'Lý do gỡ (vi phạm)', requireReason: true, icon: 'bi-slash-circle', tone: 'danger', next: 'removed', msg: 'Đã gỡ voucher' },
    }[b.dataset.act];
    const r = await CDD.confirm(cfg);
    if (r.ok) { v.status = cfg.next; if (r.reason) v.reason = r.reason; CDD.toast(cfg.msg); render(); }
  });
  render();
</script>
</body>
</html>
