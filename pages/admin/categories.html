<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-07 Quản lý ngành hàng – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body data-role="admin" data-active="categories">
<div id="cdd-header"></div>

<!-- ============ A-07 · Quản lý ngành hàng ============
  FR-4.6 Admin thêm/sửa/xóa danh mục ngành hàng (dùng cho FR-2.2)
================================================ -->
<main class="container container-cdd">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div><h1>Quản lý ngành hàng</h1><p>Danh mục ngành hàng dùng chung cho đối tác và bộ lọc của cư dân.</p></div>
    <button class="btn btn-accent px-4" id="addBtn"><i class="bi bi-plus-lg"></i>Thêm ngành hàng</button>
  </div>
  <div class="d-flex justify-content-end mb-3"><div class="search-sm"><i class="bi bi-search"></i><input id="search" class="form-control" placeholder="Tìm kiếm..." aria-label="Tìm kiếm"></div></div>
  <div class="cdd-table table-responsive">
    <table class="table align-middle"><thead><tr><th>Ngành hàng</th><th class="text-center">Đối tác</th><th class="text-center">Voucher đang chạy</th><th class="text-end">Thao tác</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <p class="small-2 text-muted-2 mt-3" id="note"></p>
</main>

<!-- Popup thêm / sửa -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="edTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content code-modal" id="editForm" novalidate>
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Đóng"></button>
      <h2 class="h5 fw-bold mb-3" id="edTitle"></h2>
      <div class="mb-3"><label class="form-label" for="fName">Tên ngành hàng <span class="req">*</span></label><input id="fName" class="form-control" placeholder="VD: Spa & Làm đẹp"><div class="invalid-feedback">Vui lòng nhập tên ngành hàng.</div></div>
      <label class="form-label">Biểu tượng</label><div id="fIcon" class="d-grid mb-3" style="grid-template-columns:repeat(6,1fr);gap:8px"></div>
      <div class="d-flex justify-content-end gap-2 mt-2"><button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button><button type="submit" class="btn btn-primary px-4">Lưu</button></div>
    </form>
  </div>
</div>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  let editing = null, q = '';
  const COUNT = { food: [12, 18], coffee: [9, 14], spa: [5, 6], gym: [3, 4], edu: [2, 2], repair: [2, 1], market: [3, 5] };
  const ICONS = ['bi-egg-fried', 'bi-cup-hot', 'bi-flower1', 'bi-bicycle', 'bi-book', 'bi-tools', 'bi-basket', 'bi-heart-pulse', 'bi-scissors', 'bi-bag', 'bi-car-front', 'bi-house'];
  const modal = () => bootstrap.Modal.getOrCreateInstance($('editModal'));
  $('note').innerHTML = '<i class="bi bi-info-circle me-1"></i>Đối tác chọn ngành hàng khi đăng ký và khi tạo voucher (FR-2.2). Không thể xóa ngành hàng đang có đối tác.';
  $('fIcon').innerHTML = ICONS.map(i => `<label class="choice"><input type="radio" name="icon" value="${i}"><span class="box text-center py-2 px-0"><i class="bi ${i} fs-5"></i></span></label>`).join('');
  function render() {
    const list = D.categories.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
    $('rows').innerHTML = list.map(c => { const i = D.categories.indexOf(c), [p, v] = COUNT[c.id] || [0, 0]; return `<tr>
      <td><div class="d-flex align-items-center gap-3"><span class="kpi"><span class="ic ic-orange"><i class="bi ${c.icon}"></i></span></span><div class="fw-semibold">${c.name}</div></div></td>
      <td class="text-center fw-semibold">${p}</td><td class="text-center">${v}</td>
      <td class="text-end text-nowrap"><button class="icon-btn" data-edit="${i}" title="Sửa" aria-label="Sửa"><i class="bi bi-pencil"></i></button>
        <button class="icon-btn" data-del="${i}" title="Xóa" aria-label="Xóa"><i class="bi bi-trash"></i></button></td></tr>`; }).join('');
  }
  function open(i) {
    editing = i; const c = i == null ? { name: '', icon: 'bi-bag' } : D.categories[i];
    $('edTitle').textContent = i == null ? 'Thêm ngành hàng' : 'Sửa ngành hàng';
    $('fName').value = c.name; $('fName').classList.remove('is-invalid');
    (document.querySelector(`input[name=icon][value="${c.icon}"]`) || document.querySelector('input[name=icon]')).checked = true; modal().show();
  }
  $('addBtn').onclick = () => open(null);
  $('rows').addEventListener('click', async (e) => {
    const ed = e.target.closest('[data-edit]'), de = e.target.closest('[data-del]');
    if (ed) open(+ed.dataset.edit);
    if (de) { const c = D.categories[de.dataset.del], [p] = COUNT[c.id] || [0];
      if (p > 0) return CDD.toast(`Không thể xóa: "${c.name}" đang có ${p} đối tác`);
      const r = await CDD.confirm({ title: `Xóa ngành hàng "${c.name}"?`, okText: 'Xóa', okClass: 'btn-danger', icon: 'bi-trash', tone: 'danger' });
      if (r.ok) { D.categories.splice(de.dataset.del, 1); render(); } }
  });
  $('editForm').addEventListener('submit', (e) => {
    e.preventDefault(); const name = $('fName').value.trim(), icon = document.querySelector('input[name=icon]:checked').value;
    if (!name) return $('fName').classList.add('is-invalid');
    if (editing == null) D.categories.push({ id: 'c' + Date.now(), name, icon }); else Object.assign(D.categories[editing], { name, icon });
    modal().hide(); CDD.toast('Đã lưu ngành hàng'); render();
  });
  $('search').addEventListener('input', (e) => { q = e.target.value; render(); });
  render();
</script>
</body>
</html>
