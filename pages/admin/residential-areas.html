<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-06 Quản lý khu dân cư – CuDanDeals.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body data-role="admin" data-active="areas">
<div id="cdd-header"></div>

<!-- ============ A-06 · Quản lý khu dân cư ============
  FR-4.3 Admin thêm/sửa/xóa khu dân cư; xem cư dân theo từng khu
================================================ -->
<main class="container container-cdd">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div><h1>Quản lý khu dân cư</h1><p>Danh sách khu dân cư hệ thống hỗ trợ.</p></div>
    <button class="btn btn-accent px-4" id="addBtn"><i class="bi bi-plus-lg"></i>Thêm khu dân cư</button>
  </div>
  <div class="d-flex justify-content-end mb-3"><div class="search-sm"><i class="bi bi-search"></i><input id="search" class="form-control" placeholder="Tìm kiếm..." aria-label="Tìm kiếm"></div></div>
  <div class="cdd-table table-responsive">
    <table class="table align-middle"><thead><tr><th>Khu dân cư</th><th>Địa chỉ</th><th class="text-center">Cư dân đã đăng ký</th><th class="text-center">Đối tác</th><th class="text-end">Thao tác</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <p class="small-2 text-muted-2 mt-3" id="note"></p>
</main>

<!-- Popup thêm / sửa -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="edTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content code-modal" id="editForm" novalidate>
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Đóng"></button>
      <h2 class="h5 fw-bold mb-3" id="edTitle"></h2>
      <div class="mb-3"><label class="form-label" for="fName">Tên khu dân cư <span class="req">*</span></label><input id="fName" class="form-control" placeholder="VD: Khu dân cư Sunrise"><div class="invalid-feedback">Vui lòng nhập tên khu dân cư.</div></div>
      <div class="mb-3"><label class="form-label" for="fAddr">Địa chỉ</label><input id="fAddr" class="form-control" placeholder="VD: Nguyễn Hữu Thọ, Quận 7, TP.HCM"></div>
      <div class="d-flex justify-content-end gap-2 mt-2"><button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button><button type="submit" class="btn btn-primary px-4">Lưu</button></div>
    </form>
  </div>
</div>
<div id="cdd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/mock-data.js"></script>
<script src="../../js/components.js"></script>
<script>
  const D = window.CDD_DATA, $ = (id) => document.getElementById(id);
  let editing = null, q = '';
  const modal = () => bootstrap.Modal.getOrCreateInstance($('editModal'));
  $('note').innerHTML = '<i class="bi bi-info-circle me-1"></i>Danh sách này dùng cho cư dân chọn khi đăng ký (FR-1.2) và đối tác chọn phạm vi voucher (FR-2.2). Không thể xóa khu đang có cư dân.';
  function render() {
    const list = D.areas.filter(a => (a.name + a.address).toLowerCase().includes(q.toLowerCase()));
    $('rows').innerHTML = list.map(a => { const i = D.areas.indexOf(a); return `<tr>
      <td><div class="d-flex align-items-center gap-3"><span class="kpi"><span class="ic ic-blue"><i class="bi bi-buildings"></i></span></span><div class="fw-semibold">${a.name}</div></div></td>
      <td class="small-2">${a.address}</td>
      <td class="text-center fw-semibold">${a.residents.toLocaleString('vi-VN')}</td>
      <td class="text-center">${[5, 1, 0][i] ?? 0}</td>
      <td class="text-end text-nowrap">
        <a class="btn btn-sm btn-light-primary" href="residents.html?area=${encodeURIComponent(a.name)}"><i class="bi bi-people"></i>Xem cư dân</a>
        <button class="icon-btn" data-edit="${i}" title="Sửa" aria-label="Sửa"><i class="bi bi-pencil"></i></button>
        <button class="icon-btn" data-del="${i}" title="Xóa" aria-label="Xóa"><i class="bi bi-trash"></i></button></td></tr>`; }).join('');
  }
  function open(i) {
    editing = i; const a = i == null ? { name: '', address: '' } : D.areas[i];
    $('edTitle').textContent = i == null ? 'Thêm khu dân cư' : 'Sửa khu dân cư';
    $('fName').value = a.name; $('fAddr').value = a.address; $('fName').classList.remove('is-invalid'); modal().show();
  }
  $('addBtn').onclick = () => open(null);
  $('rows').addEventListener('click', async (e) => {
    const ed = e.target.closest('[data-edit]'), de = e.target.closest('[data-del]');
    if (ed) open(+ed.dataset.edit);
    if (de) { const a = D.areas[de.dataset.del];
      if (a.residents > 0) return CDD.toast(`Không thể xóa: ${a.name} đang có ${a.residents} cư dân`);
      const r = await CDD.confirm({ title: `Xóa ${a.name}?`, okText: 'Xóa', okClass: 'btn-danger', icon: 'bi-trash', tone: 'danger' });
      if (r.ok) { D.areas.splice(de.dataset.del, 1); render(); } }
  });
  $('editForm').addEventListener('submit', (e) => {
    e.preventDefault(); const name = $('fName').value.trim();
    if (!name) return $('fName').classList.add('is-invalid');
    if (editing == null) D.areas.push({ id: 'new' + Date.now(), name, address: $('fAddr').value, residents: 0 });
    else Object.assign(D.areas[editing], { name, address: $('fAddr').value });
    modal().hide(); CDD.toast('Đã lưu khu dân cư'); render();
  });
  $('search').addEventListener('input', (e) => { q = e.target.value; render(); });
  render();
</script>
</body>
</html>
